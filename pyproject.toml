[project]
name = "llm-usage-monitor"
version = "0.1.0"
description = "Real-time TUI dashboard for Claude Code, OpenAI Codex, Grok Build, OpenCode GO, GitHub Copilot, and Antigravity usage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://github.com/1122-gggggg/llm_show_usage"
Repository = "https://github.com/1122-gggggg/llm_show_usage"
Issues = "https://github.com/1122-gggggg/llm_show_usage/issues"

[project.scripts]
llm-usage = "llm_usage_monitor.__main__:main"
llu = "llm_usage_monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_usage_monitor"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.4"]
