[project]
name = "llm-usage-monitor"
version = "0.1.0"
description = "Real-time TUI dashboard for LLM usage (Claude / Codex / Grok / OpenCode)"
requires-python = ">=3.11"
dependencies = ["rich>=13.7"]

[project.scripts]
llm-usage = "llm_usage_monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_usage_monitor"]

[dependency-groups]
dev = ["pytest>=8"]
